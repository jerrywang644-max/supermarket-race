<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5e8a">
<title>At the Counter · 3A Ch.3 Quantity Phrases</title>
<style>
:root { color-scheme: light; --ink:#1f140e; --sky:#8ecae6; --wood:#c9854a; --cream:#fff7ea; --navy:#0b5e8a; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Trebuchet MS","Segoe UI","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;line-height:1.25}
body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
#app{height:100%}
button,textarea,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:4px solid #ffd60a;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.awning{height:14px;flex:none;background:repeating-linear-gradient(90deg,#e63946 0 18px,#fff8ee 18px 36px)}
.start-screen,.end-screen,.name-screen{
  height:100%;overflow:auto;padding:0 14px 24px;
  background:linear-gradient(#9fd8ff,#fff8ee 36%,#f0c48a 36%,#d39a62);
}
.start-inner,.end-inner,.name-inner{max-width:980px;margin:0 auto}
h1{margin:10px 0 0;text-align:center;font-size:clamp(1.9rem,5.5vw,3.4rem);letter-spacing:-.03em;line-height:1.05;text-shadow:3px 3px 0 #ffd36a}
.chapter{margin:6px 0 0;text-align:center;font-size:clamp(1rem,2.2vw,1.4rem);font-weight:800}
.lead{text-align:center;font-size:1.08rem;font-weight:700;margin:8px auto 12px;max-width:42rem}
.parade{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 14px}
.parade .food-ico{width:64px;height:64px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card{
  text-align:left;background:#fffef8;border:4px solid var(--ink);border-bottom-width:8px;
  border-radius:18px;padding:14px 16px 12px;min-height:170px;
}
.mode-card h2{margin:0;font-size:1.7rem}
.mode-name{margin:0 0 6px;font-weight:800;font-size:1.1rem}
.mode-card p{margin:0 0 8px;font-weight:700}
.mode-easy{background:#e5f8df}
.mode-hard{background:#efe4ff}
.mode-card:active{transform:translateY(2px)}
.keyhint{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font-weight:800;font-size:.85rem}
.rules{text-align:center;font-weight:800;margin:12px 0}
.bests{text-align:center;font-weight:700;margin:0 0 8px}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0 16px}
.name-btn{
  background:#fffef8;border:3px solid var(--ink);border-radius:14px;padding:10px 8px;
  font-weight:800;min-height:54px;border-bottom-width:5px;
}
.name-btn .no{display:block;font-size:.75rem;opacity:.65}
.name-btn.selected,.name-btn:hover{background:#ffe66d}
.name-btn.mrwang{background:#dceeff}
.player-chip{text-align:center;font-weight:800;margin:4px 0 0}
.ghost{
  background:#fff;border:3px solid var(--ink);border-radius:999px;min-height:44px;
  padding:6px 16px;font-weight:800;
}
.play{height:100%;display:flex;flex-direction:column;background:var(--cream)}
.hud{
  flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  padding:8px 10px;background:var(--navy);color:#fff;
}
.hud-title{min-width:8.5rem}
.hud-title strong{display:block;font-size:1.02rem}
.hud-title span{font-size:.88rem}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.dots i.done{background:#8cff6a}
.dots i.now{background:#ffd166}
.lives{display:flex;gap:2px;align-items:center;min-height:32px}
.heart{font-size:1.55rem;line-height:1;color:#ff4d6d}
.heart.empty{color:#9ec3de}
.timer{flex:1;min-width:130px}
.timer-top{display:flex;justify-content:space-between;font-weight:800}
#time-num{font-size:1.4rem;font-variant-numeric:tabular-nums}
.track{height:14px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
#time-bar{height:100%;width:100%;background:#8cff6a;border-radius:99px;transition:width .08s linear}
#time-bar.warn{background:#ffd166}
#time-bar.danger{background:#ff5a5a;animation:blink .45s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.score-chip{
  background:#14210f;color:#b6ff4a;border:2px solid #d6ff8a;border-radius:10px;
  min-width:4.6rem;text-align:right;padding:3px 8px 4px;font-weight:800;
  font-family:ui-monospace,"Courier New",monospace;font-size:1.3rem;font-variant-numeric:tabular-nums;
}
.score-k{display:block;text-align:center;font-family:inherit;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#d6ff8a;line-height:1}
.score-chip.pop{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.icon-btn{background:transparent;color:#fff;border:2px solid #fff;border-radius:999px;min-height:40px;padding:4px 10px;font-weight:800}
.stage{
  flex:none;display:flex;gap:10px;align-items:center;padding:8px 10px 6px;
  background:linear-gradient(#8ecdf5,#fff6e8 70%);position:relative;
}
.stage.leaving{opacity:0;transform:translateX(-28px);transition:.35s ease}
.who{flex:none;text-align:center;width:110px}
.person{width:110px;height:auto;display:block}
.who-label{font-weight:800;font-size:.82rem;margin-top:-4px}
.talk{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bubble{
  background:#fff3bf;border:4px solid var(--ink);border-radius:18px;padding:8px 12px 10px;
  box-shadow:4px 4px 0 rgba(36,22,15,.12);
}
.order-kicker{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#7a3e1d;margin-bottom:2px}
#bubble-text{margin:0;font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:800}
#bubble-text.reveal{color:var(--navy)}
.held{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:nowrap}
.held-card{width:min(200px,34vw);background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px}
.held.two .held-card:first-child{transform:rotate(-4deg)}
.held.two .held-card:last-child{transform:rotate(4deg)}
.hear{
  margin-top:6px;align-self:flex-start;background:var(--navy);color:#fff;border:3px solid var(--ink);
  border-radius:999px;min-height:42px;padding:6px 14px;font-weight:800;
}
.counter{
  flex:1;min-height:0;display:flex;flex-direction:column;background:
    linear-gradient(transparent 0 8px,#7a3e1d 8px 22px,#c9854a 22px);
  padding:18px 10px 0;position:relative;
}
.basket-wrap{flex:none;display:flex;justify-content:center;margin-top:-6px;margin-bottom:8px;min-height:78px}
.basket{
  display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  min-width:min(420px,92vw);min-height:72px;padding:8px 12px;
  background:#fffef8;border:4px dashed #7a3e1d;border-radius:16px;
}
.basket .slot{
  width:64px;height:64px;border-radius:12px;background:#f3e7d3;border:2px solid #c9a67a;
  display:flex;align-items:center;justify-content:center;
}
.basket .slot.filled{background:#e5f8df;border-color:#2a9d8f}
.action{flex:1;min-height:0;overflow:auto;padding:4px 2px 8px}
.shelf{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;
  max-width:920px;margin:0 auto;
}
.item{
  background:#fff;border:3px solid var(--ink);border-bottom-width:6px;border-radius:14px;
  padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:108px;
}
.item .food-ico{width:56px;height:56px}
.item .lab{font-size:.72rem;font-weight:800;text-align:center;line-height:1.15}
.item .key{font-size:.7rem;font-weight:800;opacity:.55}
.shelf.no-labs .item{min-height:92px}
.shelf.no-labs .item .lab{display:none}
.item.is-in{background:#c8f7c5;border-color:#1b7a3a}
.item.is-bad{animation:bad .32s ease;background:#ffd0d0}
@keyframes bad{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.type-action{max-width:min(1400px,100%);width:100%;margin:0 auto;padding:4px 6px 6px}
.timer.hidden{display:none}
.ekey{
  margin-top:6px;width:100%;max-width:100%;padding:8px 6px 8px;
  background:#fff3e0;border:3px solid #7a3e1d;border-radius:14px;
  user-select:none;-webkit-user-select:none;
}
.ekey-row{display:flex;flex-wrap:nowrap;gap:6px;justify-content:stretch;margin:0 0 6px;width:100%}
.ekey-row:last-child{margin-bottom:0}
.ekey-row.phrases{flex-wrap:nowrap;gap:6px}
.ekey-btn{
  flex:1 1 0;min-width:0;min-height:3.05rem;padding:10px 6px;
  background:#fffef8;border:3px solid var(--ink);border-bottom-width:5px;
  border-radius:12px;font-weight:900;font-size:clamp(1.12rem,2.4vw,1.55rem);line-height:1;
}
.ekey-btn:active{transform:translateY(2px);border-bottom-width:3px}
.ekey-btn.wide{flex:1.5 1 0;font-size:clamp(.95rem,2vw,1.2rem);min-height:2.9rem}
.ekey-btn.space{flex:3.2 1 0;min-width:0;font-size:clamp(1rem,2.2vw,1.3rem)}
.ekey-btn.back{background:#ffd0d0;flex:1.2 1 0;font-size:clamp(1rem,2.2vw,1.3rem)}
.ekey-btn.phrase{background:#dceeff;flex:1 1 0;min-width:0;font-size:clamp(.8rem,1.6vw,1.05rem);padding:8px 4px;white-space:nowrap}
.ekey-btn.clear{background:#ffe66d;flex:1.2 1 0;font-size:clamp(.95rem,2vw,1.2rem)}
@media (max-width:720px){
  .ekey{padding:6px 4px 6px}
  .ekey-row{gap:4px;margin:0 0 4px}
  .ekey-btn{min-height:2.55rem;font-size:clamp(1rem,3.8vw,1.25rem);padding:6px 2px;border-width:2.5px;border-bottom-width:4px}
  .ekey-btn.phrase{flex:1 1 0;min-width:0;white-space:nowrap;font-size:clamp(.72rem,2.8vw,.95rem);padding:6px 2px}
  .type-action{max-width:100%;padding:2px 2px 4px}
  .answer{min-height:48px;font-size:1.02rem}
}
@media (min-width:900px){
  .ekey-btn{min-height:3rem;padding:10px 6px;font-size:clamp(1.15rem,1.8vw,1.5rem)}
  .ekey-row{gap:8px}
  .ekey-btn.phrase{font-size:clamp(.95rem,1.4vw,1.15rem)}
}
/* Hard mode: less vertical scroll — compact top, hide unused basket, sticky keyboard */
.play.hard .basket-wrap{display:none}
.play.hard .stage{padding:4px 8px 2px;gap:8px}
.play.hard .who{width:78px}
.play.hard .person{width:78px}
.play.hard .held-card{width:min(132px,28vw);padding:4px}
.play.hard .counter{padding:8px 6px 0}
.play.hard .action{overflow:visible}
.play.hard .answer{min-height:48px;resize:none;padding:8px 10px;font-size:1.08rem}
.play.hard .serve-bar{padding:4px 8px 8px}
.play.hard .serve{min-height:48px;font-size:1.2rem}
.admin-chip{
  display:inline-flex;align-items:center;gap:6px;flex:1 1 160px;min-width:0;
  background:#ffe66d;color:#1f140e;border:2px solid #1f140e;border-radius:10px;
  padding:4px 8px;font-weight:900;font-size:.82rem;line-height:1.2;
}
.admin-chip strong{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.admin-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .icon-btn.admin-on{background:#ffe66d;color:#1f140e;border-color:#1f140e}
.start-admin{margin:8px auto 0;display:block}

.type-action label{display:block;font-weight:800;margin-bottom:4px}
.answer{
  width:100%;min-height:72px;resize:vertical;border:4px solid var(--ink);border-radius:14px;
  padding:10px 12px;font-size:1.15rem;font-weight:700;background:#fff;
}
.serve-bar{flex:none;background:#7a3e1d;padding:6px 10px 10px}
.serve{
  width:100%;min-height:56px;border:4px solid var(--ink);border-radius:16px;
  background:#ffd166;font-size:1.35rem;font-weight:900;border-bottom-width:7px;
}
.serve.ready{animation:pulse .8s ease-in-out infinite;background:#ffe14a}
@keyframes pulse{50%{transform:scale(1.02)}}
.serve:active,.item:active{transform:translateY(2px)}
.flash{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  background:rgba(31,20,14,.92);color:#fff;padding:10px 18px;border-radius:14px;
  font-weight:900;font-size:1.2rem;pointer-events:none;opacity:0;z-index:5;
  transition:opacity .15s;
}
.flash.show{opacity:1}
.flash.ok{background:#1b7a3a}
.flash.bad{background:#b00020}
.play.shake{animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.end-actions{display:flex;gap:10px;margin:14px 0}
.end-actions .serve,.end-actions .ghost{width:auto;flex:1}
.scoreline{text-align:center;font-weight:800;font-size:1.15rem}
.stars{text-align:center;font-size:2.2rem;margin-top:10px}
.miss{background:#fffef8;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0}
.miss.ok{background:#e5f8df}
.miss h3{margin:0 0 4px}
.miss ul{margin:4px 0;padding-left:1.2rem}
.bank-title{margin-top:18px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.bank>div{display:flex;align-items:center;gap:8px;background:#fffef8;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;font-weight:800}
.board{margin:12px 0;background:#fffef8;border:4px solid var(--ink);border-radius:16px;padding:10px 12px}
.board h2{margin:0 0 6px;font-size:1.2rem}
.board ol{margin:0;padding-left:1.3rem;font-weight:700}
.board li{margin:2px 0}

.food-wrap{position:relative;display:inline-block;vertical-align:middle;flex:none}
.food-ico{display:block;width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid #1f140e;background:#fff}
.qty-badge{
  position:absolute;right:-4px;bottom:-4px;min-width:1.35rem;height:1.35rem;padding:0 4px;
  border-radius:999px;background:#e63946;color:#fff;border:2px solid #1f140e;
  font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.held-card .food-wrap{width:100%!important;height:auto!important;aspect-ratio:1}
.held-card .food-ico{width:100%;height:auto;aspect-ratio:1}
.item .food-wrap{width:56px;height:56px}
.parade .food-wrap{width:56px;height:56px}

.food-ico{display:block}
@media (max-width:720px){
  .modes{grid-template-columns:1fr}
  .who{width:88px}
  .person{width:88px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
  .item{min-height:96px}
  .serve{min-height:52px;font-size:1.2rem}
}
</style>
</head>

    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch];
  });
}
function later(fn, ms){
  const id = setTimeout(function(){
    state.pending = state.pending.filter(function(x){ return x!==id; });

  state.pending.push(id);

}

function normalize(s){
  return String(s).toLowerCase()
    .replace(/[\u2019\u2018]/g,"'")
    .replace(/'/g,"")
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function matchesAnswer(raw, phrases){
  let n = normalize(raw);
  if(!n || !phrases || !phrases.length) return false;
  // light book-friendly aliases
  n = n
    .replace(/\bhot dogs\b/g, "hot dog")
    .replace(/\bhotdogs\b/g, "hot dog")
    .replace(/\bhotdog\b/g, "hot dog")
    .replace(/\bfrench\s*fries\b/g, "french fries")
    .replace(/\bpotato\s*crisps\b/g, "potato chips")
    .replace(/\ba\s+apple\s+pie\b/g, "an apple pie");
  const lead = [
    "please can i have ","please may i have ","please i would like ","please id like ",
    "please give me ","can i have ","may i have ","i would like ","id like ",
    "i want ","give me ","please "
  ];
  let guard=0, changed=true;
  while(changed && guard<8){
    changed=false; guard++;
    for(let i=0;i<lead.length;i++){
      if(n.indexOf(lead[i])===0){ n=n.slice(lead[i].length).trim(); changed=true; break; }
    }
    if(n.slice(-7)===" please"){ n=n.slice(0,-7).trim(); changed=true; }
    else if(n.slice(-7)===" thanks"){ n=n.slice(0,-7).trim(); changed=true; }
    else if(n.slice(-10)===" thank you"){ n=n.slice(0,-10).trim(); changed=true; }
  }
  const wanted = phrases.map(normalize).sort(function(a,b){ return b.length-a.length; });
  for(let w=0;w<wanted.length;w++){
    const phrase = wanted[w];
    const at = n.indexOf(phrase);
    if(at===-1) return false;
    n = (n.slice(0,at)+" "+n.slice(at+phrase.length)).replace(/\s+/g," ").trim();
  }
  n = n.replace(/\b(and|please|thanks)\b/g," ").replace(/\bthank you\b/g," ").replace(/\s+/g," ").trim();
  return n.length===0;
}
function isQuantityPhrase(item){
  return /\bof\b/i.test(item.phrase || "");
}
function buildOrders(mode){
  const hard = mode==="hard";
  const pool = hard ? ITEMS.filter(isQuantityPhrase) : ITEMS.slice();
  const items = shuffle(pool);
  const orders = [];
  let i=0;
  if(hard){
    // Hard: one quantity phrase per customer only
    for(let p=0;p<8;p++){
      orders.push([items[i++ % items.length]]);
    }
    return orders;
  }
  for(let p=0;p<ROUND_PATTERN.length;p++){
    if(ROUND_PATTERN[p]==="S") orders.push([items[i++ % items.length]]);
    else {
      const a = items[i++ % items.length];
      let b = items[i++ % items.length];
      if(b.id===a.id) b = items[(i+1)%items.length];
      orders.push([a,b]);
    }
  }
  return orders;
}
function makePrompt(order, index){
  const a = order[0].phrase;
  const b = order[1] ? order[1].phrase : "";
  const like = index % 2 === 1;
  if(!b) return like ? "I'd like " + a + ", please." : "Can I have " + a + ", please?";
  return like
    ? "I'd like " + a + " and " + b + ", please."
    : "Can I have " + a + " and " + b + ", please.";
}

function getCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!audioCtx){ try{ audioCtx = new AC(); }catch(e){ return null; } }
  return audioCtx;
}
function unlockAudio(){
  const ctx = getCtx();
  if(ctx && ctx.state==="suspended") ctx.resume();
  if(window.speechSynthesis){ try{ speechSynthesis.resume(); }catch(e){} }
}
function tone(freq, dur, type, when, gain){
  if(!state.sound) return;
  const ctx = getCtx();
  if(!ctx) return;
  const t = ctx.currentTime + (when||0);
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(gain||0.06, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.02);
}

function pickVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  const en = voices.filter(function(v){ return /^en([-_]|$)/i.test(v.lang); });
  return en.filter(function(v){ return /en-GB/i.test(v.lang); })[0] ||
    en.filter(function(v){ return /en-HK/i.test(v.lang); })[0] || en[0] || null;
}
function speak(text){
  if(!state.sound || !text || !window.speechSynthesis) return;
  window.clearTimeout(speakTimer);
  speakTimer = window.setTimeout(function(){
    if(!state.sound || state.screen!=="play") return;
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB";
      u.rate = 0.9;
      const voice = pickVoice();
      if(voice) u.voice = voice;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){}
  }, 80);
}

function insertAtAnswer(chunk){
  const ta = document.getElementById("answer");
  if(!ta) return;
  const start = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
  const end = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
  const before = ta.value.slice(0, start);
  const after = ta.value.slice(end);
  ta.value = before + chunk + after;
  const pos = before.length + chunk.length;
  ta.focus();
  try{ ta.setSelectionRange(pos, pos); }catch(e){}
}
function handleEKey(code){
  if(state.mode!=="hard" || state.screen!=="play") return;
  if(code==="back"){
    const ta = document.getElementById("answer");
    if(!ta) return;
    const start = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    const end = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
    if(start!==end){
      ta.value = ta.value.slice(0,start)+ta.value.slice(end);
      try{ ta.setSelectionRange(start,start); }catch(e){}
    } else if(start>0){
      ta.value = ta.value.slice(0,start-1)+ta.value.slice(end);
      try{ ta.setSelectionRange(start-1,start-1); }catch(e){}
    }
    ta.focus();
    return;
  }
  if(code==="clear"){
    const ta = document.getElementById("answer");
    if(ta){ ta.value=""; ta.focus(); }
    return;
  }
  if(code==="enter"){
    const ta = document.getElementById("answer");
    tryServeHard(ta ? ta.value : "");
    return;
  }
  if(code==="space"){ insertAtAnswer(" "); return; }
  if(code.length===1){ insertAtAnswer(code); return; }
}

        const on = state.picked.indexOf(item.id)>=0 ? " is-in" : "";
        const lab = easyChallenge ? "" : '<span class="lab">'+esc(item.short)+'</span>';
        return '<button type="button" class="item'+on+'" data-action="pick" data-id="'+item.id+'" aria-label="'+esc(item.phrase)+'">'+
          foodSVG(item,52)+lab+'<span class="key">'+esc(item.key)+'</span></button>';
      }).join("")+'</div></div>';
  const serve = hard
    ? '<button type="submit" form="serve-form" id="serve-btn" class="serve">Serve</button>'
    : '<button type="button" id="serve-btn" class="serve" data-action="serve">Serve</button>';
  const whoName = "Customer "+(state.index+1);
  return '<main class="play '+state.mode+'">'+
    '<div class="hud">'+
      '<div class="hud-title"><strong>At the counter</strong><span>'+(hard?"Hard · type":"Easy · listen")+' · '+esc(state.player?state.player.name:"")+'</span>'+
      '<div class="dots" aria-hidden="true">'+dotsHTML()+'</div></div>'+
      '<div class="lives" id="lives" aria-label="'+state.lives+' lives left">'+heartsHTML()+'</div>'+
      '<div class="timer'+(hard?' hidden':'')+'"'+(hard?' aria-hidden="true"':'')+'><div class="timer-top"><span>Time</span><span id="time-num">—</span></div>'+
      '<div class="track"><div id="time-bar"></div></div></div>'+
      '<div class="score-chip"><span class="score-k">Score</span><span id="score">'+state.score+'</span></div>'+
      adminChipHTML()+
      '<button type="button" class="icon-btn'+(state.admin?' admin-on':'')+'" data-action="admin" aria-label="Admin">'+(state.admin?"Admin":"🔑")+'</button>'+
      '<button type="button" class="icon-btn" data-action="toggle-sound" aria-label="Sound">'+(state.sound?"🔊":"🔇")+'</button>'+
      '<button type="button" class="icon-btn" data-action="quit">Quit</button>'+
    '</div>'+
    '<div class="stage" id="stage">'+
      '<div class="who">'+personSVG("wait")+'<div class="who-label">'+whoName+'</div></div>'+
      '<div class="talk">'+talkInner+'</div>'+
    '</div>'+
    '<div class="counter">'+
      '<div class="basket-wrap"><div class="basket" id="basket" aria-label="Basket">'+slotsHTML()+'</div></div>'+
      action+
      '<div class="serve-bar">'+serve+'</div>'+
      '<div class="flash" id="flash" aria-hidden="true"></div>'+
    '</div>'+
    '</main>';
}
function mistakesHTML(){
  if(!state.mistakes.length) return "";
  return state.mistakes.map(function(m){
    const wanted = esc(m.wanted.join(" and "));
    const lines = m.errors.map(function(line){ return "<li>"+esc(line)+"</li>"; }).join("");
    const said = m.mode==="easy" && m.prompt ? "<p><strong>The customer said:</strong> "+esc(m.prompt)+"</p>" : "";
    const tail = m.ok ? "<p>You served the right food after that.</p>" : "<p><strong>Correct phrase:</strong> "+wanted+"</p>";
    return '<article class="miss'+(m.ok?" ok":"")+'"><h3>Customer '+m.n+' · '+(m.ok?"served":"not served")+'</h3>'+said+"<ul>"+lines+"</ul>"+tail+"</article>";
  }).join("");
}
function starRow(n){
  return '<div class="stars" aria-hidden="true">'+("★".repeat(n))+("☆".repeat(3-n))+'</div>';
}
function endHTML(){
  const stars = state.cleared && state.mistakes.every(function(m){ return m.ok; }) ? 3 : state.cleared ? 2 : 1;
  let title = "Shop closed";
  if(!state.cleared) title = "No lives left";
  if(state.cleared && state.mistakes.length===0) title = "Well done!";
  const modeName = state.mode==="easy" ? "Easy · Listen and pick" : "Hard · Picture and type";
  const best = readBest(state.mode);
  return '<main class="end-screen"><div class="awning"></div><div class="end-inner">'+
    starRow(stars)+
    '<h1>'+title+'</h1>'+
    '<p class="chapter">Longman 3A · Ch.3 · Quantity phrases</p>'+
    '<p class="scoreline">'+esc(state.player?state.player.name:"")+' · '+modeName+
    '<br>You served '+state.served+' of 8 customers.<br>Score: '+state.score+(best?" · Best: "+best:"")+'</p>'+
    '<div class="end-actions"><button type="button" class="serve" data-action="again">Play again</button>'+
    '<button type="button" class="ghost" data-action="home">Home</button></div>'+
    (state.mistakes.length ? "<h2>Mistakes</h2>" : "")+mistakesHTML()+
    boardHTML(state.mode)+
    '<h2 class="bank-title">All the phrases</h2><div class="bank">'+
    ITEMS.map(function(item){ return "<div>"+foodSVG(item,40)+"<span>"+esc(item.phrase)+"</span></div>"; }).join("")+
    "</div></div></main>";
}

function render(){
  stopTimer();
  clearLater();
  if(state.screen==="name") app.innerHTML = nameHTML();
  else if(state.screen==="start") app.innerHTML = startHTML();
  else if(state.screen==="play"){
    app.innerHTML = playHTML();
    if(state.mode==="easy"){
      startTimer();
      const order = currentOrder();
      speak(makePrompt(order, state.index));
    } else {
      stopTimer();
      later(function(){
        const ta = document.getElementById("answer");
        if(ta) ta.focus();
      }, 60);
    }
    refreshServe();
  } else if(state.screen==="end") app.innerHTML = endHTML();
}

function beginGame(mode){
  unlockAudio();
  stopSpeech();
  state.mode = mode;
  state.orders = buildOrders(state.mode);
  state.index = 0;
  state.picked = [];
  state.lives = 3;
  state.score = 0;
  state.served = 0;
  state.cleared = false;
  state.mistakes = [];
  state.look = Math.floor(Math.random()*LOOKS.length);
  state.screen = "play";
  render();
}
function leaveCustomer(next){
  const stage = document.getElementById("stage");
  if(stage) stage.classList.add("leaving");
  later(function(){
    state.index += 1;
    state.picked = [];
    state.look = (state.look + 1) % LOOKS.length;
    if(state.index >= 8){
      state.cleared = true;
      finishGame();
    } else {
      render();
    }
  }, stage ? 280 : 40);
}
function finishGame(){
  stopTimer();
  stopSpeech();
  writeBest();
  writeBoardEntry();
  state.screen = "end";
  render();
}
function noteMistake(errorLine, ok){
  const order = currentOrder();
  const wanted = order.map(function(x){ return x.phrase; });
  let row = null;
  for(let i=0;i<state.mistakes.length;i++){
    if(state.mistakes[i].n === state.index+1){ row = state.mistakes[i]; break; }
  }
  if(!row){
    row = {
      n: state.index+1,
      mode: state.mode,
      prompt: state.mode==="easy" ? makePrompt(order, state.index) : "",
      wanted: wanted,
      errors: [],
      ok: !!ok
    };
    state.mistakes.push(row);
  }
  if(errorLine) row.errors.push(errorLine);
  if(ok) row.ok = true;
}
function failCustomer(flashText, errorLine){
  stopSpeech();
  sfxBad();
  shake();
  setMood("sad");
  flash(flashText, "bad");
  state.lives -= 1;
  updateHearts();
  noteMistake(errorLine || flashText, false);
  if(state.lives <= 0){
    later(finishGame, 650);
    return;
  }
  later(function(){ leaveCustomer(); }, 700);
}
function succeedCustomer(){
  stopTimer();
  stopSpeech();
  sfxServe();
  setMood("happy");
  flash("Thank you!", "ok");
  const order = currentOrder();
  const bonus = state.mode==="hard"
    ? 40
    : Math.max(20, Math.round((state.endsAt - performance.now())/1000)*5);
  const base = 100 + (order.length===2 ? 50 : 0);
  state.score += base + bonus;
  state.served += 1;
  updateScore();
  // mark any prior mistake row for this customer as recovered
  for(let i=0;i<state.mistakes.length;i++){
    if(state.mistakes[i].n===state.index+1) state.mistakes[i].ok = true;
  }
  later(function(){ leaveCustomer(); }, 550);
}
function tryServeEasy(){
  const order = currentOrder();
  if(!state.picked.length){
    flash("Pick the food first", "bad");
    sfxBad();
    return;
  }
  if(!orderComplete()){
    sfxBad();
    shake();
    setMood("sad");
    flash("Wrong order!", "bad");
    noteMistake("Picked wrong items", false);
    state.lives -= 1;
    updateHearts();
    state.picked = [];
    document.querySelectorAll(".item.is-in").forEach(function(el){ el.classList.remove("is-in"); });
    updateBasket();
    refreshServe();
    if(state.lives <= 0){
      stopTimer();
      later(finishGame, 650);
    }
    return;
  }
  succeedCustomer();
}
function tryServeHard(raw){
  const order = currentOrder();
  const phrases = order.map(function(x){ return x.phrase; });
  if(matchesAnswer(raw, phrases)){
    succeedCustomer();
    return;
  }
  sfxBad();
  shake();
  setMood("sad");
  flash("Check the phrase!", "bad");
  noteMistake("Typed: " + (raw || "(empty)"), false);
  state.lives -= 1;
  updateHearts();
  const ta = document.getElementById("answer");
  if(ta){ ta.select(); }
  if(state.lives <= 0){
    stopTimer();
    later(finishGame, 650);
  }
}
function pickItem(id){
  const order = currentOrder();
  if(state.picked.indexOf(id) >= 0){
    // unpick
    state.picked = state.picked.filter(function(x){ return x!==id; });
    document.querySelectorAll("[data-action='pick']").forEach(function(btn){
      if(btn.getAttribute("data-id")===id) btn.classList.remove("is-in");
    });
    updateBasket();
    refreshServe();
    return;
  }
  if(state.picked.length >= order.length){
    flash("Basket full — Serve or unpick", "bad");
    return;
  }
  const wantedIds = order.map(function(x){ return x.id; });
  if(wantedIds.indexOf(id) === -1){
    markBad(id);
    sfxBad();
    flash("Not that one!", "bad");
    noteMistake("Tapped wrong: " + (itemById(id)||{}).phrase, false);
    state.lives -= 1;
    updateHearts();
    if(state.lives <= 0){
      stopTimer();
      later(finishGame, 650);
    }
    return;
  }
  state.picked.push(id);
  markPicked(id);
  sfxOk();
  updateBasket();
  refreshServe();
}

function onAction(action, el, ev){
  if(action==="pick-name"){
    const no = Number(el.getAttribute("data-no"));
    const p = CLASS_ROSTER.filter(function(x){ return x.no===no; })[0];
    if(!p) return;
    state.player = p;
    savePlayer(p);
    render();
    return;
  }
  if(action==="to-modes"){
    if(!state.player) return;
    state.screen = "start";
    render();
    return;
  }
  if(action==="change-name"){
    state.screen = "name";
    render();
    return;
  }
  if(action==="easy" || action==="hard"){
    beginGame(action);
    return;
  }
  if(action==="again"){
    beginGame(state.mode);
    return;
  }
  if(action==="home"){
    stopSpeech();
    state.screen = "start";
    render();
    return;
  }
  if(action==="quit"){
    stopSpeech();
    stopTimer();
    state.screen = "start";
    render();
    return;
  }
  if(action==="toggle-sound"){
    state.sound = !state.sound;
    if(!state.sound) stopSpeech();
    else unlockAudio();
    const btn = el;
    if(btn) btn.textContent = state.sound ? "🔊" : "🔇";
    return;
  }
  if(action==="hear"){
    unlockAudio();
    const order = currentOrder();
    speak(makePrompt(order, state.index));
    return;
  }
  if(action==="pick"){
    pickItem(el.getAttribute("data-id"));
    return;
  }
  if(action==="serve"){
    tryServeEasy();
    return;
  }
  if(action==="ekey"){
    ev && ev.preventDefault && ev.preventDefault();
    handleEKey(el.getAttribute("data-key")||"");
    return;
  }
  if(action==="admin"){
    unlockAdmin();
    return;
  }
}

app.addEventListener("mousedown", function(ev){
  const el = ev.target.closest("[data-action='ekey']");
  if(el && app.contains(el)) ev.preventDefault(); // keep textarea focus
});
app.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-action]");
  if(!el || !app.contains(el)) return;
  onAction(el.getAttribute("data-action"), el, ev);
});
app.addEventListener("submit", function(ev){
  const form = ev.target.closest("#serve-form");
  if(!form) return;
  ev.preventDefault();
  const ta = document.getElementById("answer");
  tryServeHard(ta ? ta.value : "");
});

document.addEventListener("keydown", function(ev){
  if(state.screen==="start"){
    if(ev.key==="e" || ev.key==="E"){ beginGame("easy"); return; }
    if(ev.key==="h" || ev.key==="H"){ beginGame("hard"); return; }
  }
  if(state.screen!=="play") return;
  if(ev.key==="Escape"){ onAction("quit"); return; }
  if(state.mode==="easy"){
    if(ev.key==="Enter"){ ev.preventDefault(); tryServeEasy(); return; }
    const map = {};
    ITEMS.forEach(function(it){ map[it.key]=it.id; });
    if(map[ev.key]){ ev.preventDefault(); pickItem(map[ev.key]); }
  }
});

if(window.speechSynthesis){
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){ pickVoice(); }; }catch(e){}
}

state.player = loadPlayer();
state.admin = loadAdmin();
state.screen = state.player ? "start" : "name";
// Always show name first if teacher wants roster every time? Spec: name menu — show name screen first.
state.screen = "name";
render();
})();
</script>
</body>
</html>
